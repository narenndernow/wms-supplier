apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-service
  namespace: wms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplier-service
  template:
    metadata:
      labels:
        app: supplier-service
    spec:
      containers:
        - name: supplier-service
          image: SUPPLIER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087

          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/warehouse_supplier_db"

            - name: DB_USERNAME
              value: "postgres"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supplier-db-secret
                  key: password

            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"

            # Zipkin distributed tracing
            - name: ZIPKIN_URL
              value: "http://zipkin:9411/api/v2/spans"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"