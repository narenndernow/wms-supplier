# Application Name
spring.application.name=supplier-service

# application port
server.port = ${SERVER_PORT:8087}

#=========================================
# JDBC / data jpa configuration
#=========================================
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/warehouse_product_db}
spring.datasource.username = {DB_USERNAME:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}

spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.hibernate.ddl-auto= create
spring.jpa.open-in-view = false

spring.jpa.show-sql =false
spring.jpa.properties.hibernate.format_sql= true

#==========================================
# EUREKA service-gateway discovery information
#===========================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

#==============================================
#Logging configuration
#==============================================
login.level.root = INFO
logging.level.com.wms.supplier = DEBUG
logging.level.org.springframework.web= INFO
logging.level.org.springframework.security = INFO
logging.level.org.hibernate.SQL = WARN

# log pattern for local development
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}, %X{spanId:-}] %logger{36} -%msg%n


#========================================================
# Actuator
#=========================================================
management.endpoint.web.exposure.include= health, info, metrics, prometheus

##############################################
#jwt
###############################################
jwt.secret=${JWT_SECRET:local-development-secret-must-have-at-least-32-bytes}
jwt.issuer=${JWT_ISSUER:wms-auth-service}


###################################################
# kafka configuration
###################################################

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true